<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1200" width="2560" height="1200" style="background:#ffffff; font-family:'Inter', 'Noto Sans', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Soft Drop Shadow for Top Header and Cards -->
    <filter id="box-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <filter id="pill-shadow" x="-3%" y="-5%" width="106%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Crisp White Canvas -->
  <rect width="2560" height="1200" fill="#ffffff" />

  <!-- ==================== TREE CONNECTING BUS LINES ==================== -->
  <g stroke="#94a3b8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Drop from Header Box -->
    <line x1="1280" y1="130" x2="1280" y2="185" />
    <!-- Horizontal Bus Line connecting all 5 columns -->
    <line x1="300" y1="185" x2="2260" y2="185" />
    <!-- Drops into each column -->
    <line x1="300" y1="185" x2="300" y2="235" />
    <line x1="790" y1="185" x2="790" y2="235" />
    <line x1="1280" y1="185" x2="1280" y2="235" />
    <line x1="1770" y1="185" x2="1770" y2="235" />
    <line x1="2260" y1="185" x2="2260" y2="235" />
  </g>

  <!-- ==================== TOP HEADER BOX (HOME PAGE STYLE) ==================== -->
  <g transform="translate(880, 38)" filter="url(#box-shadow)">
    <rect x="0" y="0" width="800" height="92" rx="18" fill="#24334a" />
    <text x="400" y="58" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FLUXO BEAUTYFLOW</text>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 1: PORTAL DO CLIENTE (Green #10b981) -->
  <!-- ========================================================================= -->
  <g transform="translate(75, 235)">
    <!-- Header Card -->
    <rect x="0" y="0" width="450" height="250" rx="20" fill="#10b981" filter="url(#box-shadow)" />
    
    <!-- Icon: Mobile / Booking -->
    <g transform="translate(225, 75)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-18" y="-30" width="36" height="58" rx="8" />
      <line x1="-8" y1="20" x2="8" y2="20" />
      <circle cx="0" cy="-10" r="7" />
      <path d="M -9 10 Q 0 4 9 10" />
    </g>

    <text x="225" y="165" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PORTAL DO CLIENTE</text>
    <text x="225" y="198" font-size="19" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Autoatendimento online</text>

    <!-- Pill 1 -->
    <g transform="translate(0, 275)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#10b981" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#10b981" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Agendamento online simples</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">e rápido pelo celular</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 390)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#10b981" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#10b981" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Escolha de serviços, datas</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">e horários disponíveis</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 505)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#10b981" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#10b981" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Confirmação instantânea</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">sem precisar de mensagem</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 2: PAINEL DE GESTÃO (Teal #06b6d4) -->
  <!-- ========================================================================= -->
  <g transform="translate(565, 235)">
    <!-- Header Card -->
    <rect x="0" y="0" width="450" height="250" rx="20" fill="#06b6d4" filter="url(#box-shadow)" />
    
    <!-- Icon: Team / Salon CRM -->
    <g transform="translate(225, 75)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-14" cy="-16" r="10" />
      <circle cx="14" cy="-16" r="10" />
      <path d="M -26 18 C -26 2 -18 -2 -14 -2 C -10 -2 -2 2 -2 18" />
      <path d="M 2 18 C 2 2 10 -2 14 -2 C 18 -2 26 2 26 18" />
      <path d="M -7 6 L 7 6" stroke-width="3.2" />
    </g>

    <text x="225" y="165" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PAINEL DE GESTÃO</text>
    <text x="225" y="198" font-size="19" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">CRM e controle do salão</text>

    <!-- Pill 1 -->
    <g transform="translate(0, 275)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#06b6d4" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#06b6d4" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Controle completo de</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">agenda em tempo real</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 390)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#06b6d4" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#06b6d4" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Gestão de clientes, estoque</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">e produtos em falta</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 505)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#06b6d4" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#06b6d4" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Relatórios financeiros,</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">comissões e faturamento</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 3: CENTRAL INTELIGENTE (Blue #0ea5e9) -->
  <!-- ========================================================================= -->
  <g transform="translate(1055, 235)">
    <!-- Header Card -->
    <rect x="0" y="0" width="450" height="250" rx="20" fill="#0ea5e9" filter="url(#box-shadow)" />
    
    <!-- Icon: Smart Processing / Hub -->
    <g transform="translate(225, 75)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-6" r="16" />
      <path d="M 0 -18 L 0 -25 M 0 6 L 0 13 M -12 -6 L -19 -6 M 12 -6 L 19 -6" />
      <path d="M -3 -10 L 4 -6 L -2 -2 L 3 2" />
    </g>

    <text x="225" y="165" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">CENTRAL INTELIGENTE</text>
    <text x="225" y="198" font-size="19" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Processamento em tempo real</text>

    <!-- Pill 1 -->
    <g transform="translate(0, 275)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#0ea5e9" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#0ea5e9" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Sincroniza agendamentos</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">entre cliente e salão ao vivo</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 390)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#0ea5e9" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#0ea5e9" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Calcula horários vagos e</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">evita conflitos de agenda</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 505)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#0ea5e9" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#0ea5e9" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Atualiza a agenda do salão</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">e o estoque automaticamente</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 4: BANCO DE DADOS (Purple #a855f7) -->
  <!-- ========================================================================= -->
  <g transform="translate(1545, 235)">
    <!-- Header Card -->
    <rect x="0" y="0" width="450" height="250" rx="20" fill="#a855f7" filter="url(#box-shadow)" />
    
    <!-- Icon: Database / Storage -->
    <g transform="translate(225, 75)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="0" cy="-18" rx="22" ry="8" />
      <path d="M -22 -18 V -3 C -22 2 -12 6 0 6 C 12 6 22 2 22 -3 V -18" />
      <path d="M -22 -3 V 12 C -22 17 -12 21 0 21 C 12 21 22 17 22 12 V -3" />
    </g>

    <text x="225" y="165" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">BANCO DE DADOS</text>
    <text x="225" y="198" font-size="19" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Histórico seguro e persistência</text>

    <!-- Pill 1 -->
    <g transform="translate(0, 275)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#a855f7" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#a855f7" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Guarda com segurança dados</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">de clientes e atendimentos</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 390)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#a855f7" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#a855f7" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Registro imutável de vendas,</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">compras e estoque do salão</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 505)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#a855f7" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#a855f7" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Opção de backup e</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">restauração dos dados</text>
    </g>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 5: INTEGRAÇÕES & ALERTAS (Orange #f59e0b) -->
  <!-- ========================================================================= -->
  <g transform="translate(2035, 235)">
    <!-- Header Card -->
    <rect x="0" y="0" width="450" height="250" rx="20" fill="#f59e0b" filter="url(#box-shadow)" />
    
    <!-- Icon: Google Calendar / Sync -->
    <g transform="translate(225, 75)" stroke="#ffffff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-20" y="-18" width="40" height="40" rx="8" />
      <line x1="-20" y1="-4" x2="20" y2="-4" />
      <line x1="-10" y1="-26" x2="-10" y2="-18" stroke-width="3" />
      <line x1="10" y1="-26" x2="10" y2="-18" stroke-width="3" />
      <circle cx="0" cy="12" r="3.5" fill="#ffffff" />
      <circle cx="-10" cy="12" r="3.5" fill="#ffffff" />
      <circle cx="10" cy="12" r="3.5" fill="#ffffff" />
    </g>

    <text x="225" y="165" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">INTEGRAÇÕES &amp; ALERTAS</text>
    <text x="225" y="198" font-size="19" font-weight="500" fill="rgba(255,255,255,0.92)" text-anchor="middle">Google Agenda e avisos no CRM</text>

    <!-- Pill 1 -->
    <g transform="translate(0, 275)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#f59e0b" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#f59e0b" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Sincronização automática</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">com a agenda do Google</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(0, 390)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#f59e0b" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#f59e0b" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Notificações instantâneas de</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">novos agendamentos no painel</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(0, 505)" filter="url(#pill-shadow)">
      <rect x="0" y="0" width="450" height="96" rx="20" fill="#f59e0b" />
      <circle cx="45" cy="48" r="22" fill="#ffffff" />
      <circle cx="45" cy="48" r="8" fill="#f59e0b" />
      <text x="86" y="42" font-size="20" font-weight="700" fill="#ffffff">Disparo de webhooks para</text>
      <text x="86" y="68" font-size="20" font-weight="700" fill="#ffffff">integrações externas (n8n)</text>
    </g>
  </g>


  <!-- ==================== FOOTER SECTION ==================== -->
  <g transform="translate(75, 875)">
    <line x1="0" y1="0" x2="2410" y2="0" stroke="#cbd5e1" stroke-width="2" />
    
    <text x="0" y="38" font-size="22" font-weight="700" fill="#475569">Footer (Fluxo Operacional Integrado do Sistema)</text>

    <!-- 5 Footer Columns -->
    <g transform="translate(0, 56)" font-size="16.5" font-weight="500" fill="#64748b">
      <!-- Col 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="24">• 1. Cliente solicita agendamento</text>
        <text x="0" y="50">• Sem necessidade de app instalado</text>
        <text x="0" y="76">• Confirmação imediata na tela</text>
      </g>

      <!-- Vertical divider 1 -->
      <line x1="465" y1="12" x2="465" y2="82" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Col 2 -->
      <g transform="translate(490, 0)">
        <text x="0" y="24">• 2. Atualiza o CRM do Salão</text>
        <text x="0" y="50">• Alerta sonoro e visual ao vivo</text>
        <text x="0" y="76">• Bloqueio automático de horário</text>
      </g>

      <!-- Vertical divider 2 -->
      <line x1="955" y1="12" x2="955" y2="82" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Col 3 -->
      <g transform="translate(980, 0)">
        <text x="0" y="24">• Processamento inteligente</text>
        <text x="0" y="50">• Validação de horários livres</text>
        <text x="0" y="76">• Baixa no estoque de insumos</text>
      </g>

      <!-- Vertical divider 3 -->
      <line x1="1445" y1="12" x2="1445" y2="82" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Col 4 -->
      <g transform="translate(1470, 0)">
        <text x="0" y="24">• 3. Salva no Histórico Seguro</text>
        <text x="0" y="50">• Banco de dados PostgreSQL</text>
        <text x="0" y="76">• Opção de backup e restauração</text>
      </g>

      <!-- Vertical divider 4 -->
      <line x1="1935" y1="12" x2="1935" y2="82" stroke="#e2e8f0" stroke-width="1.5" />

      <!-- Col 5 -->
      <g transform="translate(1960, 0)">
        <text x="0" y="24">• 4. Sincronia &amp; Notificações</text>
        <text x="0" y="50">• Conexão Google Calendar (OAuth)</text>
        <text x="0" y="76">• Alertas e webhooks em tempo real</text>
      </g>
    </g>
  </g>
</svg>
