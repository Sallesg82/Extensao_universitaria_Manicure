services:
  postgres:
    image: postgres:16
    container_name: beautyflow_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautyflow
      POSTGRES_USER: beautyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beautyflow -d beautyflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
