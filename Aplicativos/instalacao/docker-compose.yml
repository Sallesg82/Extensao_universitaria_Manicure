services:
  crm:
    build:
      context: "../CRM-Mirian (protótipo)"
      dockerfile: instalacao/Dockerfile
    container_name: beautyflow-crm
    ports:
      - "3001:3001"
    volumes:
      - ../../DB:/shared_db
    environment:
      - BEAUTYFLOW_DB_PATH=/shared_db/beautyflow.db
      - BEAUTYFLOW_NO_SEED=true
    restart: unless-stopped
    networks:
      - beautyflow_net

  agenda:
    build:
      context: "../agendamento Vinicius"
      dockerfile: instalacao/Dockerfile
    container_name: beautyflow-agendamento
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - beautyflow_net

networks:
  beautyflow_net:
    driver: bridge
