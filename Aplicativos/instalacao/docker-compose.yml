services:
  postgres:
    image: postgres:16-alpine
    container_name: beautyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautyflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: beautyflow_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - "../CRM BeautyFlow/backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beautyflow"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - beautyflow-net

  crm-backend:
    build:
      context: "../CRM BeautyFlow"
      dockerfile: "../instalacao/Dockerfile.crm"
    container_name: beautyflow-crm
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:beautyflow_pass@postgres:5432/beautyflow
      N8N_WEBHOOK_URL: https://mirianfiorini.app.n8n.cloud/webhook/calendar-webhook
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/')"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - beautyflow-net

  agendamento-app:
    build:
      context: "../Beatriz Gomes Studio"
      dockerfile: "../instalacao/Dockerfile.agendamento"
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    container_name: beautyflow-agendamento
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      crm-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - beautyflow-net

networks:
  beautyflow-net:
    driver: bridge

volumes:
  postgres_data:
