services:
  crm:
    build:
      context: "../CRM BeautyFlow"
      dockerfile: instalacao/Dockerfile
    container_name: beautyflow-crm
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - beautyflow_net

  agenda:
    build:
      context: "../agendamento Vinicius"
      dockerfile: instalacao/Dockerfile
    container_name: beautyflow-agendamento
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - beautyflow_net

networks:
  beautyflow_net:
    driver: bridge
