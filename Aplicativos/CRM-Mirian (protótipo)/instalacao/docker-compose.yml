services:
  app:
    build:
      context: ..
      dockerfile: instalacao/Dockerfile
    container_name: beautyflow-crm
    ports:
      - "3001:3001"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - beautyflow_net

